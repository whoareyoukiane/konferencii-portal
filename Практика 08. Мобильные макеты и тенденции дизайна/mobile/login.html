<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход · Конференции.РФ</title>
    <link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="bar">
    <a class="logo" href="index.html">Конференции<b>.РФ</b></a>
    <button class="menu" type="button">Меню</button>
</div>

<div class="wrap">
    <h1>Вход</h1>
    <form onsubmit="return false">
        <div class="field">
            <label for="login">Логин</label>
            <input id="login" name="login" autocomplete="username">
        </div>
        <div class="field bad">
            <label for="password">Пароль</label>
            <input id="password" name="password" type="password" autocomplete="current-password">
            <p class="err">Введите пароль</p>
        </div>
        <button class="btn" type="submit">Войти</button>
    </form>
    <p class="meta">Нет аккаунта? <a href="login.html">Зарегистрироваться</a></p>
</div>

<nav class="tabs">
    <a href="index.html">Мероприятия</a>
    <a href="requests.html">Заявки</a>
    <a class="on" href="login.html">Вход</a>
</nav>
</body>
</html>
